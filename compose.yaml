services:
  jupyter:
    build: .
    image: jupyterlab-ml:local
    container_name: jupyterlab-ml
    restart: unless-stopped
    # ホストのユーザーに合わせて ./work の権限問題を避ける
    user: root
    environment:
      NB_UID: ${NB_UID:-1000}
      NB_GID: ${NB_GID:-1000}
      CHOWN_HOME: "yes"
      CHOWN_HOME_OPTS: "-R"
      JUPYTER_ENABLE_LAB: "yes"
      # 必ず .env で設定する
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?JUPYTER_TOKEN を .env に設定してください}
    # ホストの localhost のみ公開。外部へは tailscale serve 経由
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./work:/home/jovyan/work
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
